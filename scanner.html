
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b70">
<title>สแกนบาร์โค้ดสินค้า</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f2f5fa;
  color:#172033;
  font-family:Arial,sans-serif;
  padding:16px;
}
main{
  max-width:720px;
  margin:0 auto;
  background:#fff;
  border:1px solid #dce4ef;
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 30px #102a430d;
}
h1{font-size:21px;margin:0 0 6px;color:#163b70}
.sub{color:#64748b;font-size:13px;margin-bottom:16px}
#reader{
  width:100%;
  min-height:260px;
  overflow:hidden;
  border-radius:14px;
  background:#101827;
}
#reader video{
  width:100%!important;
  height:auto!important;
  object-fit:cover;
}
#status{
  padding:12px 2px;
  min-height:46px;
  font-size:14px;
  color:#334155;
  line-height:1.6;
  overflow-wrap:anywhere;
}
.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}
button,select{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:15px;
}
button{
  background:#1d4ed8;
  color:white;
  cursor:pointer;
}
button.alt{
  background:#e8eef8;
  color:#163b70;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
select{
  background:#f1f5f9;
  max-width:100%;
  border:1px solid #cbd5e1;
}
.note{
  font-size:12px;
  color:#64748b;
  line-height:1.6;
  margin-top:14px;
}
.code{
  font-size:23px;
  font-weight:bold;
  letter-spacing:1px;
  color:#15803d;
  word-break:break-all;
  margin:8px 0;
}
</style>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
<main>

<h1>📷 สแกนบาร์โค้ดสินค้า</h1>
<div class="sub">
STOCK COUNT · ใช้กล้องหลังหรือกล้องที่เชื่อมต่อกับอุปกรณ์
</div>

<div id="reader"></div>

<div id="status" role="status">
กำลังเตรียมตัวอ่านบาร์โค้ด...
</div>

<div class="actions">
<button id="startBtn" type="button">เริ่มกล้อง</button>
<button id="stopBtn" class="alt" type="button" disabled>หยุดกล้อง</button>

<select id="cameraSelect" aria-label="เลือกกล้อง">
<option value="">กล้องหลัง (อัตโนมัติ)</option>
</select>
</div>

<div class="note">
อนุญาตการใช้กล้องเมื่อเบราว์เซอร์ถาม
หากไม่เห็นภาพ ให้ปิดแอปอื่นที่กำลังใช้กล้อง
</div>

</main>

<script>
'use strict';

/* ==============================
   CONFIGURATION
============================== */

const params = new URLSearchParams(location.search);
const returnUrl = params.get('returnUrl') || '';

const statusEl = document.getElementById('status');
const readerEl = document.getElementById('reader');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const selectEl = document.getElementById('cameraSelect');

let scanner = null;
let starting = false;
let running = false;
let stopping = false;
let completed = false;
let sendStarted = false;
let startPromise = null;
let stopRequested = false;
let selectedCameraId = '';

const F = window.Html5QrcodeSupportedFormats || {};

const formatsToSupport = [
  F.EAN_13,
  F.EAN_8,
  F.UPC_A,
  F.UPC_E,
  F.CODE_128,
  F.CODE_39,
  F.ITF,
  F.CODABAR
].filter(x => x !== undefined);


/* ==============================
   STATUS
============================== */

function showStatus(message){
  statusEl.textContent = message;
}

function updateButtons(){
  startBtn.disabled =
    starting || running || stopping || completed;

  stopBtn.disabled =
    !running || stopping || completed;

  selectEl.disabled =
    starting || running || stopping || completed;
}


/* ==============================
   CREATE SCANNER
============================== */

function createScanner(){

  if(scanner) return scanner;

  scanner = new Html5Qrcode('reader',{
    formatsToSupport:formatsToSupport,
    verbose:false
  });

  return scanner;
}


/* ==============================
   CAMERA LIST
============================== */

async function loadCameraList(){

  try{

    const cameras = await Html5Qrcode.getCameras();

    selectEl.innerHTML = '';

    const defaultOption = document.createElement('option');
    defaultOption.value = '';
    defaultOption.textContent = 'กล้องหลัง (อัตโนมัติ)';

    selectEl.appendChild(defaultOption);

    cameras.forEach((camera,index)=>{

      const option = document.createElement('option');

      option.value = camera.id;
      option.textContent =
        camera.label || ('กล้อง '+(index+1));

      selectEl.appendChild(option);

    });

    const rearCamera = cameras.find(camera =>
      /back|rear|environment|หลัง/i.test(camera.label || '')
    );

    if(rearCamera){
      selectedCameraId = rearCamera.id;
      selectEl.value = rearCamera.id;
    }

    return cameras;

  }catch(error){

    console.warn('Camera enumeration:',error);

    return [];

  }

}


/* ==============================
   START CAMERA
============================== */

async function startCamera(){

  if(starting || running || stopping || completed){
    return;
  }

  if(!window.isSecureContext){

    showStatus('ต้องเปิดหน้านี้ผ่าน HTTPS เท่านั้น');
    return;

  }

  if(typeof Html5Qrcode === 'undefined'){

    showStatus('โหลดระบบอ่านบาร์โค้ดไม่สำเร็จ กรุณารีโหลดหน้า');
    return;

  }

  starting = true;
  stopRequested = false;
  updateButtons();

  const task = (async()=>{

    try{

      showStatus('กำลังเตรียมกล้อง...');

      const reader = createScanner();

      /*
       * ตรวจสอบรายชื่อกล้องก่อนเริ่มเท่านั้น
       * ไม่เรียกตรวจซ้ำระหว่างสแกน
       */

      let cameraId = selectEl.value || selectedCameraId;

      if(!cameraId){

        const cameras = await loadCameraList();

        const rear = cameras.find(camera =>
          /back|rear|environment|หลัง/i.test(camera.label || '')
        );

        if(rear){
          cameraId = rear.id;
        }

      }

      const config = {
        fps:10,

        qrbox:(width,height)=>({

          width:Math.min(
            Math.floor(width*.88),
            520
          ),

          height:Math.min(
            Math.floor(height*.38),
            180
          )

        }),

        aspectRatio:1.777,
        disableFlip:false
      };

      showStatus('กำลังเปิดกล้อง กรุณารอสักครู่...');

      /*
       * เปิดกล้องเพียงหนึ่งครั้ง
       */

      if(cameraId){

        await reader.start(
          cameraId,
          config,
          onScan,
          onScanError
        );

      }else{

        await reader.start(
          {facingMode:'environment'},
          config,
          onScan,
          onScanError
        );

      }

      running = true;

      showStatus(
        'กล้องเปิดแล้ว วางบาร์โค้ดให้อยู่ในกรอบกล้อง'
      );

      /*
       * หากมีคำสั่งหยุดระหว่างกำลังเปิดกล้อง
       */

      if(stopRequested){
        await stopCamera();
      }

    }catch(error){

      running = false;

      let message = error?.message || String(error);

      if(/permission|denied|notallowed/i.test(message)){

        message =
          'ไม่ได้รับอนุญาตใช้กล้อง กรุณาอนุญาต Camera ในการตั้งค่าเว็บไซต์';

      }else if(/notfound|devicesnotfound/i.test(message)){

        message = 'ไม่พบกล้องในอุปกรณ์';

      }else if(/notreadable|trackstart/i.test(message)){

        message =
          'กล้องกำลังถูกใช้งานโดยแอปอื่น กรุณาปิดแอปที่ใช้กล้อง';

      }

      showStatus('เปิดกล้องไม่สำเร็จ: '+message);

      console.error('START CAMERA ERROR:',error);

    }finally{

      starting = false;
      updateButtons();

    }

  })();

  startPromise = task;

  try{

    await task;

  }finally{

    if(startPromise === task){
      startPromise = null;
    }

  }

}


/* ==============================
   SCAN ERROR CALLBACK
============================== */

function onScanError(errorMessage){

  /*
   * ไม่แสดง Error ทุกเฟรม
   * เพราะเป็นเรื่องปกติที่กล้องยังอ่านบาร์โค้ดไม่เจอ
   */

}


/* ==============================
   BARCODE VALIDATION
============================== */

function validCode(value){

  return /^[0-9A-Za-z\-.$/+% ]{4,40}$/.test(
    String(value || '').trim()
  );

}


/* ==============================
   SCAN RESULT
============================== */

function onScan(decodedText){

  if(completed || sendStarted) return;

  const code = String(decodedText || '').trim();

  if(!validCode(code)) return;

  sendResult(code);

}


/* ==============================
   STOP CAMERA
============================== */

async function stopCamera(){

  if(stopping) return;

  if(starting){

    stopRequested = true;

    if(startPromise){
      try{
        await startPromise;
      }catch(error){}
    }

  }

  if(!running || !scanner){

    updateButtons();
    return;

  }

  stopping = true;
  updateButtons();

  try{

    /*
     * หยุดเฉพาะเมื่อสถานะเป็น SCANNING
     * ไม่เรียก clear() โดยเด็ดขาด
     */

    const state = scanner.getState();

    if(state === 2){

      await scanner.stop();

    }

    running = false;

  }catch(error){

    console.error('STOP CAMERA ERROR:',error);

    running = false;

  }finally{

    stopping = false;
    updateButtons();

  }

}


/* ==============================
   SEND BARCODE TO MAIN SYSTEM
============================== */

async function sendResult(value){

  if(sendStarted || completed) return;

  sendStarted = true;
  completed = true;

  const code = String(value).trim();

  statusEl.innerHTML =
    'อ่านบาร์โค้ดสำเร็จ' +
    '<div class="code"></div>' +
    '<div>กำลังส่งกลับระบบนับสต๊อก...</div>';

  statusEl.querySelector('.code').textContent = code;

  updateButtons();

  /*
   * รอให้กล้องหยุดก่อนส่งข้อมูล
   */

  if(startPromise){

    try{
      await startPromise;
    }catch(error){}

  }

  if(running){
    await stopCamera();
  }

  let sent = false;

  /*
   * วิธีที่ 1: ส่งกลับหน้าต่างต้นทาง
   */

  try{

    if(window.opener && !window.opener.closed){

      window.opener.postMessage({

        type:'STOCK_COUNT_BARCODE',
        barcode:code

      },'*');

      sent = true;

    }

  }catch(error){

    console.error('POST MESSAGE ERROR:',error);

  }

  /*
   * วิธีที่ 2: ส่งผ่าน returnUrl
   */

  if(returnUrl){

    try{

      const url = new URL(returnUrl);

      url.searchParams.set('barcode',code);

      if(sent){

        showStatus('ส่ง Barcode กลับแล้ว: '+code);

        setTimeout(()=>{
          try{
            window.close();
          }catch(error){}
        },1000);

      }else{

        showStatus('กำลังกลับไปยังระบบนับสต๊อก...');

        location.replace(url.toString());

      }

      return;

    }catch(error){

      console.error('RETURN URL ERROR:',error);

    }

  }

  /*
   * ไม่มีช่องทางส่งกลับ
   */

  if(sent){

    showStatus('ส่ง Barcode กลับหน้าระบบแล้ว: '+code);

    setTimeout(()=>{
      try{
        window.close();
      }catch(error){}
    },1000);

  }else{

    statusEl.innerHTML =
      'อ่านบาร์โค้ดได้ แต่ยังส่งกลับระบบไม่ได้' +
      '<div class="code"></div>' +
      '<div>กรุณาตรวจสอบการเชื่อมต่อกับหน้าระบบนับสต๊อก</div>';

    statusEl.querySelector('.code').textContent = code;

  }

}


/* ==============================
   BUTTON EVENTS
============================== */

startBtn.addEventListener('click',()=>{

  startCamera();

});

stopBtn.addEventListener('click',async()=>{

  await stopCamera();

  showStatus('หยุดกล้องแล้ว');

});


/* ==============================
   CAMERA CHANGE
============================== */

selectEl.addEventListener('change',async()=>{

  if(starting || stopping || completed) return;

  selectedCameraId = selectEl.value;

  if(running){

    await stopCamera();

    await startCamera();

  }

});


/* ==============================
   PAGE CLEANUP
============================== */

window.addEventListener('pagehide',()=>{

  if(scanner && running){

    scanner.stop().catch(error=>{
      console.warn('Page cleanup:',error);
    });

  }

});


/* ==============================
   INITIALIZE
============================== */

showStatus('แตะปุ่มเริ่มกล้องเพื่อเปิดกล้อง');

updateButtons();

</script>
</body>
</html>
