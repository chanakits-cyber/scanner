
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<title>สแกนบาร์โค้ดสินค้า</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f3f6fb;color:#172033;font-family:'Kanit',sans-serif}
main{max-width:520px;margin:0 auto;background:#fff;border:1px solid #e3e9f2;border-radius:16px;padding:18px;box-shadow:0 4px 18px #17203310}
h2{margin:0 0 6px;color:#163b70;font-size:20px}
p{font-size:13px;color:#64748b;margin:0 0 12px}
video{width:100%;max-height:58vh;object-fit:cover;background:#0b1220;border-radius:12px}
.field{margin-top:12px}
label{display:block;font-size:13px;margin-bottom:5px;color:#475569}
select,input{width:100%;min-height:43px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff}
button{border:0;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer}
.primary{background:#1d4ed8;color:white}
.secondary{background:#eaf0fb;color:#163b70}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
#status{min-height:40px;padding:10px 0;color:#475569;font-size:13px}
.note{font-size:12px;color:#64748b;margin-top:12px}
</style>
</head>
<body>
<main>
 <h2>📷 สแกนบาร์โค้ดสินค้า</h2>
 <p>กดปุ่มเริ่มเปิดกล้อง และอนุญาตการใช้กล้องเมื่อเบราว์เซอร์แจ้งเตือน</p>

 <video id="video" autoplay muted playsinline></video>
 <div id="status">พร้อมใช้งาน กรุณากดเริ่มเปิดกล้อง</div>

 <div class="field">
  <label for="camera">เลือกกล้อง</label>
  <select id="camera">
   <option value="">ใช้กล้องหลังอัตโนมัติ</option>
  </select>
 </div>

 <div class="actions">
  <button class="primary" id="start">เริ่ม / เปิดกล้องใหม่</button>
  <button class="secondary" id="close">ปิดหน้าสแกน</button>
 </div>

 <div class="field">
  <label for="manual">หรือกรอกบาร์โค้ดเอง</label>
  <input id="manual" autocomplete="off" placeholder="กรอก Barcode">
 </div>

 <div class="actions">
  <button class="primary" id="send">ส่ง Barcode กลับระบบ</button>
 </div>

 <div class="note">ภาพจากกล้องจะใช้สำหรับอ่านบาร์โค้ดเท่านั้น ไม่มีการอัปโหลดหรือบันทึกภาพ</div>
</main>

<script>
'use strict';

const $ = id => document.getElementById(id);
const statusEl = $('status');
const video = $('video');

let reader = null;
let controls = null;
let selectedDeviceId = '';
let locked = false;

const params = new URLSearchParams(location.search);
const returnOrigin = params.get('returnOrigin') || '';

function setStatus(message){
  statusEl.textContent = message;
}

function validReturnOrigin(){
  try{
    const u = new URL(returnOrigin);
    return u.protocol === 'https:' &&
      (
        u.hostname === 'script.google.com' ||
        u.hostname.endsWith('.script.googleusercontent.com') ||
        u.hostname === 'script.googleusercontent.com'
      );
  }catch(e){
    return false;
  }
}

function sendBarcode(value){
  const barcode = String(value || '').trim();

  if(!barcode){
    setStatus('ไม่พบบาร์โค้ด กรุณากรอกหรือสแกนใหม่');
    return;
  }

  if(!window.opener || window.opener.closed){
    setStatus('อ่านบาร์โค้ดได้แล้ว แต่ไม่พบหน้าระบบเดิม กรุณาเปิดจากระบบนับสต๊อก');
    return;
  }

  if(!validReturnOrigin()){
    setStatus('ไม่สามารถส่งกลับได้: ที่อยู่หน้าระบบไม่ถูกต้อง');
    return;
  }

  window.opener.postMessage(
    {type:'STOCK_BARCODE', barcode:barcode},
    returnOrigin
  );

  setStatus('ส่ง Barcode กลับระบบแล้ว');
  stopCamera();
  setTimeout(()=>window.close(),500);
}

async function stopCamera(){
  if(controls){
    try{controls.stop();}catch(e){}
    controls=null;
  }

  if(reader){
    try{reader.reset();}catch(e){}
    reader=null;
  }

  if(video.srcObject){
    video.srcObject.getTracks().forEach(track=>{
      try{track.stop();}catch(e){}
    });
    video.srcObject=null;
  }
}

async function loadCameraList(){
  const select = $('camera');
  const previous = selectedDeviceId;

  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d=>d.kind==='videoinput');

    select.innerHTML='';

    const automatic = document.createElement('option');
    automatic.value='';
    automatic.textContent='ใช้กล้องหลังอัตโนมัติ';
    select.appendChild(automatic);

    cameras.forEach((device,index)=>{
      const option=document.createElement('option');
      option.value=device.deviceId;
      option.textContent=device.label || `กล้อง ${index+1}`;
      select.appendChild(option);
    });

    if(previous && cameras.some(d=>d.deviceId===previous)){
      select.value=previous;
    }else{
      select.value='';
    }
  }catch(e){
    console.warn('ไม่สามารถอ่านรายชื่อกล้องได้',e);
  }
}

async function startCamera(){
  await stopCamera();
  locked=false;

  if(!window.isSecureContext){
    setStatus('ต้องเปิดผ่าน HTTPS จึงจะใช้งานกล้องได้');
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง กรุณาใช้ Safari หรือ Chrome รุ่นล่าสุด');
    return;
  }

  if(!window.ZXingBrowser ||
     !ZXingBrowser.BrowserMultiFormatReader){
    setStatus('โหลดระบบอ่านบาร์โค้ดไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต');
    return;
  }

  try{
    setStatus('กำลังเปิดกล้อง กรุณารอสักครู่...');

    const videoConstraints = selectedDeviceId
      ? {deviceId:{exact:selectedDeviceId}}
      : {facingMode:{ideal:'environment'}};

    const constraints = {
      audio:false,
      video:videoConstraints
    };

    reader = new ZXingBrowser.BrowserMultiFormatReader();

    controls = await reader.decodeFromConstraints(
      constraints,
      video,
      (result,error)=>{
        if(result && !locked){
          locked=true;

          const barcode=result.getText();
          $('manual').value=barcode;

          if(window.opener && !window.opener.closed && validReturnOrigin()){
            sendBarcode(barcode);
          }else{
            setStatus('อ่านบาร์โค้ดได้แล้ว: '+barcode);
          }
        }
      }
    );

    try{
      await video.play();
    }catch(playError){
      console.warn('Video play warning:',playError);
    }

    await loadCameraList();

    setStatus('เปิดกล้องสำเร็จ พร้อมสแกนบาร์โค้ด');

  }catch(e){
    console.error('Camera error:',e);

    let message=e.message || 'ไม่สามารถเปิดกล้องได้';

    if(e.name==='NotAllowedError' || e.name==='PermissionDeniedError'){
      message='ไม่ได้รับอนุญาตใช้กล้อง กรุณาตรวจสอบสิทธิ์กล้องของเว็บไซต์';
    }else if(e.name==='NotFoundError'){
      message='ไม่พบกล้องในอุปกรณ์';
    }else if(e.name==='NotReadableError' || e.name==='AbortError'){
      message='ไม่สามารถใช้งานกล้องได้ กรุณาปิดแอปที่กำลังใช้กล้องแล้วลองใหม่';
    }else if(e.name==='OverconstrainedError'){
      message='ไม่สามารถใช้กล้องที่เลือกได้ กรุณาเลือกกล้องอื่น';
    }

    await stopCamera();
    setStatus('เปิดกล้องไม่สำเร็จ: '+message);
  }
}

$('start').addEventListener('click',startCamera);

$('close').addEventListener('click',async()=>{
  await stopCamera();
  window.close();
});

$('send').addEventListener('click',()=>{
  sendBarcode($('manual').value);
});

$('camera').addEventListener('change',async()=>{
  selectedDeviceId=$('camera').value;
  await startCamera();
});

window.addEventListener('pagehide',stopCamera);

if(!validReturnOrigin()){
  setStatus('โหมดทดสอบกล้อง กรุณากดปุ่มเริ่มเปิดกล้อง');
}
</script>
</body>
</html>
